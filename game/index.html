<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1026">
  <meta name="description" content="One lantern. Five minutes. A forest full of shadows. An original arena survival game with procedural art and synthesized sound.">
  <title>Emberfall — Survive Until Dawn</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1026; color: #f5ead9; }
    * { box-sizing: border-box; }
    html, body, main { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    main { position: relative; }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; outline: none; touch-action: none; }
    canvas:focus-visible { outline: 2px solid #ffd16666; outline-offset: -3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main>
    <canvas id="game" width="1440" height="900" tabindex="0" role="application" aria-label="Emberfall — Survive Until Dawn" aria-describedby="instructions">Your browser needs Canvas to play Emberfall.</canvas>
    <p id="instructions" class="sr-only">Click or press Enter to begin. Move with WASD or arrow keys. Aim with the mouse. Hold the left mouse button or Space to fire. P pauses. M mutes. Collect teal ember shards and choose upgrades with the mouse or keys 1, 2, 3. Survive 300 seconds to win.</p>
    <p id="status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
